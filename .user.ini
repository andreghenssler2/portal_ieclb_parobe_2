[PHP]
display_errors = Off
max_execution_time = 1600
max_input_time = 300
memory_limit = 512M
max_input_vars = 1000
post_max_size = 1024M
upload_max_filesize = 1024M
output_buffering = On
always_populate_raw_post_data = -1
session.gc_maxlifetime = 1440
session.save_path = "/var/cpanel/php/sessions/ea-php83"
zlib.output_compression = Off
